<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#fff}
.topbar{display:flex;gap:10px;padding:14px;background:#1f2937;position:sticky;top:0;z-index:999999}
input{flex:1;min-width:0;padding:12px;border:0;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:0 18px;cursor:pointer;font-size:15px;font-weight:700}
#openBtn{background:#22c55e;color:#06210f}
#reloadBtn{background:#60a5fa;color:#071426}
#status{padding:10px 14px;background:#0f172a;font-size:13px;color:#cbd5e1}
#page{min-height:calc(100vh - 92px);background:white;color:black}
.empty{display:grid;place-items:center;min-height:calc(100vh - 92px);color:#64748b;padding:30px;text-align:center}
.error{color:#b91c1c;background:#fee2e2;padding:20px;margin:20px;border-radius:10px}
</style>
</head>
<body>
<div class="topbar">
<input id="urlInput" type="url" placeholder="https://example.com">
<button id="openBtn">Open</button>
<button id="reloadBtn" disabled>Reload server page</button>
</div>
<div id="status">Enter a website address.</div>
<div id="page"><div class="empty">The Playwright browser runs on the server.<br>Open a website to see its rendered HTML.</div></div>
<script>
const urlInput=document.getElementById("urlInput");
const openBtn=document.getElementById("openBtn");
const reloadBtn=document.getElementById("reloadBtn");
const statusBox=document.getElementById("status");
const pageBox=document.getElementById("page");

function showResult(result){
    if(result.error){
        pageBox.innerHTML='<div class="error">'+result.error.replaceAll("<","&lt;")+"</div>";
        return;
    }
    pageBox.innerHTML=result.html;
    reloadBtn.disabled=false;
    statusBox.textContent="Server browser URL: "+result.url;
}

async function openSite(){
    const url=urlInput.value.trim();
    if(!url){statusBox.textContent="Please enter a URL.";return}
    openBtn.disabled=true;
    reloadBtn.disabled=true;
    statusBox.textContent="Opening the website in Playwright...";
    try{
        const response=await fetch("/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
        showResult(await response.json());
    }catch(error){statusBox.textContent="Request failed: "+error.message}
    finally{openBtn.disabled=false}
}

async function reloadServerPage(){
    reloadBtn.disabled=true;
    statusBox.textContent="Reloading the Playwright page on the server...";
    try{
        const response=await fetch("/reload",{method:"POST"});
        showResult(await response.json());
    }catch(error){statusBox.textContent="Reload failed: "+error.message}
    finally{reloadBtn.disabled=false}
}

openBtn.addEventListener("click",openSite);
reloadBtn.addEventListener("click",reloadServerPage);
urlInput.addEventListener("keydown",event=>{if(event.key==="Enter")openSite()});
</script>
</body>
</html>
